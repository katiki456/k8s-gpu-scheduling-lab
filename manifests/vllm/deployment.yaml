# Inference deployment — sim variant.
# A mock OpenAI-compatible server that requests a (simulated) GPU, so the
# scheduling path, GPU pool placement, and KEDA scaling are identical to
# production. Swap the image + args for the real-mode vLLM variant below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      nodeSelector:
        node-pool: gpu
      containers:
        - name: vllm
          # sim mode: lightweight HTTP server exporting vllm-shaped metrics.
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 3

