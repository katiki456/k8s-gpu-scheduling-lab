# kube-prometheus-stack values, trimmed for a laptop-sized kind cluster.
grafana:
  adminPassword: gpu-lab
  defaultDashboardsEnabled: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: gpu-lab
          orgId: 1
          folder: GPU Lab
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/gpu-lab
  dashboardsConfigMaps:
    gpu-lab: gpu-lab-dashboard

prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    # Pick up pods annotated with prometheus.io/scrape (the inference pods)
    # and the fake DCGM exporter without needing per-app ServiceMonitors.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: gpu-lab-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: exported_namespace

# Disable components that don't exist / don't matter on kind.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
alertmanager:
  enabled: false
